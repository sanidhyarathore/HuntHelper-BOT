# APPLICATION QUALITY RULES
# ------------------------------------------------------------

auto_apply_if:

  minimum_match_score: 72

  required:
    - Role matches at least one Tier-1 target function
    - Seniority is Manager or above
    - No hard exclusion criteria triggered
    - Role has credible business ownership or strategic scope

  strong_apply_if:
    - Match score >= 82
    - Singapore / UAE / Europe / US / Japan / Bangkok
    - P&L ownership
    - Revenue ownership
    - Category ownership
    - CEO / COO / founder exposure
    - International expansion
    - Strong technology brand
    - High-growth startup
    - Fintech
    - Marketplace
    - Consumer internet

  manual_review_if:
    - Match score between 60 and 71
    - Director / AVP title with unusually broad scope
    - Unclear compensation
    - Ambiguous role seniority
    - Strong company but imperfect function match
    - Interesting fintech / Web3 / financial-markets adjacency
    - US role with unclear sponsorship
    - Europe role with unclear work authorization
    - Saudi / Qatar role with unusually strong upside

  auto_reject_if:
    - Match score < 60
    - Any hard exclusion triggered
    - Role is primarily execution without ownership
    - Role is materially below current career level
    - Role is primarily telecalling / field sales
    - Role requires deep software engineering
    - Role requires quantitative research / quant development


