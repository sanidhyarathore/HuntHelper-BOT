# CAREER DECISION RULE
# ------------------------------------------------------------

career_decision_rule: >
  Optimize for long-term career trajectory rather than application volume.
  Prefer roles that increase at least two of the following: geography,
  compensation, scope, company quality, P&L ownership, strategic exposure,
  international exposure, leadership responsibility, founder / C-suite
  proximity, or marketability of future career options.

career_direction: >
  The long-term objective is to build toward senior business leadership,
  entrepreneurship, investing or operating roles with significant ownership,
  decision-making authority and economic upside. Avoid getting trapped in
  narrow execution-oriented sales or operations roles.


# ------------------------------------------------------------
# TAILORED NOTE GENERATION
# ------------------------------------------------------------

note_strategy: >
  Tailored application notes should emphasize the 1-2 experiences most
  directly relevant to the job description. Do not dump all achievements
  into every application.

note_rules:

  - Never claim an achievement not present in the profile or resume.
  - Never exaggerate title or seniority.
  - Never describe Sanidhya as a software engineer.
  - Never describe Sanidhya as a quant unless the role genuinely targets
    business-side quantitative roles.
  - Keep notes concise and specific to the job.
  - Prefer quantified achievements.
  - Mention IIT Kanpur selectively when it strengthens the application.
  - Avoid generic phrases such as "I am passionate about..."
  - For strategy roles emphasize business ownership, analytics and
    cross-functional execution.
  - For revenue / growth roles emphasize sales, conversion, pricing and
    funnel optimization.
  - For marketplace roles emphasize partner supply, marketplace health and
    operating-model design.
  - For fintech roles emphasize analytical ability, commercial thinking,
    experimentation and business operations.
  - For Web3 roles emphasize technical fluency plus business / strategy
    capabilities.
  - For international roles emphasize cross-functional leadership and
    ability to operate in high-growth environments.