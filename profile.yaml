# ------------------------------------------------------------
# INTERNATIONAL / VISA RULES
# ------------------------------------------------------------

visa_rules:

  us:
    priority: high
    rule: >
      Do not automatically reject US roles because sponsorship may be required.
      Prefer companies that explicitly sponsor international candidates or have
      established H-1B / employment visa processes. If sponsorship is clearly
      unavailable, downgrade rather than automatically apply.

  europe:
    priority: high
    rule: >
      Prefer employers that sponsor skilled-worker visas or have established
      international relocation programs. Do not reject solely because
      sponsorship is not mentioned unless the listing explicitly requires
      existing work authorization.

  singapore:
    priority: very_high
    rule: >
      Prefer roles where the employer is known or likely to support Employment
      Pass sponsorship. Treat Singapore as one of the highest-priority
      international markets.

  uae:
    priority: very_high
    rule: >
      UAE relocation is highly attractive. Employer-sponsored relocation or
      employment visa should be treated as a strong positive signal.

  japan:
    priority: high
    rule: >
      Consider roles where English is the primary working language or where
      Japanese proficiency is not mandatory.

  thailand:
    priority: high
    rule: >
      Prioritize Bangkok roles at multinational, technology, fintech,
      consumer-internet and high-growth companies where English is the primary
      working language.

  saudi_arabia:
    priority: low
    rule: >
      Saudi Arabia is not a preferred destination. Only surface roles with
      exceptional compensation, scope, brand, international exposure or career
      upside for manual review.


